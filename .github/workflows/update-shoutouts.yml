name: Update Shoutouts

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-shoutouts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate shoutouts.json
        env:
          STRETY_TOKEN: ${{ secrets.STRETY_TOKEN }}
          STRETY_SHOUTOUTS_PATH: /shoutouts
          FISCAL_START_MONTH: "1"
        run: python strety_shoutouts.py
      - name: Commit shoutouts.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shoutouts.json
          if ! git diff --staged --quiet; then
            git commit -m "Update shoutouts.json"
            git push
          fi
